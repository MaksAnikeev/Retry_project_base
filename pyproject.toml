[project]
name = "retry-project-1"
version = "0.1.0"
description = "FastAPI Backend for train retry"
authors = [{name = "Maks", email = "105814349+MaksAnikeev@users.noreply.github.com"}]
requires-python = ">=3.11,<4.0"
readme = "README.md"

# Основные зависимости (продакшен)
dependencies = [
    # Database & Migrations
    "alembic>=1.18.4,<2.0.0",
    "sqlalchemy>=2.0.49,<3.0.0",
    "asyncpg>=0.31.0,<0.32.0",

    # Validation & Settings
    "pydantic[email]>=2.13.2,<3.0.0",
    "pydantic-settings>=2.13.1,<3.0.0",

    # Utilities
    "ujson>=5.12.0,<6.0.0",
    "pwdlib[argon2]>=0.3.0,<0.4.0",

    # Web Framework
    "fastapi>=0.136.0,<0.137.0",
    "uvicorn>=0.44.0,<0.45.0",

    # Auth
    "pyjwt>=2.12.1,<3.0.0",
    "aiohttp (>=3.13.5,<4.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "circuitbreaker (>=2.1.3,<3.0.0)",
    "celery[redis] (>=5.6.3,<6.0.0)",
    "flower (>=2.0.1,<3.0.0)",
    "asyncio (>=4.0.0,<5.0.0)",
    "aiokafka (>=0.14.0,<0.15.0)",
]

# ─────────────────────────────────────
# Poetry Groups (гибкое управление зависимостями)
# Работает только с Poetry (--with, --only, --without)
# ─────────────────────────────────────
[tool.poetry]
package-mode = false  # 🔥 Важно: не устанавливать проект как пакет

# 🔹 Dev-группа (тесты, линтеры, CI/CD)
[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
black = "^26.3.1"
mypy = "^1.0.0"
ruff = "^0.1.0"

# 🔹 Docs-группа (документация) - опционально
# [tool.poetry.group.docs.dependencies]
# mkdocs = "^1.0.0"
# mkdocs-material = "^9.0.0"

# ─────────────────────────────────────
# Инструменты (линтеры, тесты, форматирование)
# ─────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ─────────────────────────────────────
# Система сборки
# ─────────────────────────────────────
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
